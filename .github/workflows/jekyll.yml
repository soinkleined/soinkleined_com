# Builds this Hydejack site and deploys _site to GitHub Pages.
# _config.yml keeps url https://www.soinkleined.com and baseurl '' for local serve.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN rights required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # jekyll-last-modified-at reads git history for dates.
          fetch-depth: 0

      - name: Setup Ruby
        # Version comes from .ruby-version. bundler-cache runs bundle install
        # into vendor/bundle (see .bundle/config) and caches the result.
        # Gemfile.lock is gitignored; setup-ruby generates one with bundle lock.
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        # kramdown-math-katex compiles math through ExecJS, which needs Node.
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # configure-pages@v6 sets origin and base_path from the live Pages site.
        # Before a custom domain is saved, that is https://soinkleined.github.io
        # and /soinkleined_com, so CSS, images, and links resolve on the project
        # URL. After www.soinkleined.com is saved in Pages, the same step gets
        # that origin and a quoted empty baseurl, with no further workflow edit.
        run: |
          cat > "$RUNNER_TEMP/jekyll-pages.yml" <<'EOF'
          url: "${{ steps.pages.outputs.origin }}"
          baseurl: "${{ steps.pages.outputs.base_path }}"
          EOF
          bundle exec jekyll build --config _config.yml,"$RUNNER_TEMP/jekyll-pages.yml"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # _config.yml publishes .well-known. v5 omits dotfiles unless asked.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
